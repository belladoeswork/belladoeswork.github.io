title: Vanessa Bella
markdown: kramdown

# for atom feed
author:
  name: Vanessa Bella
  email: vanessabellandaa@gmail.com

plugins:
  - jemoji
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections:
  posts:
    output: true

# baseurl: "/"
defaults:
  - scope:
      path: "_posts"
    values:
      layout: "post"
      permalink: /posts/:title/
exclude: ["sitemap.xml", "feed.xml", "README.md"]
